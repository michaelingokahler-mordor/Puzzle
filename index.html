<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Puzzle Spiel">
    <meta name="format-detection" content="telephone=no">
    <title>Puzzle Spiel - Drag & Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧩 Puzzle Spiel <span class="version">v0.9</span></h1>
            <p>Laden Sie ein Bild und setzen Sie das Puzzle zusammen!</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="imageUpload">Bild laden:</label>
                <input type="file" id="imageUpload" accept="image/*" capture="environment">
            </div>

            <div class="control-group">
                <label for="gridSize">Puzzle-Größe:</label>
                <select id="gridSize">
                    <option value="10">10x10 (100 Teile)</option>
                    <option value="12">12x12 (144 Teile)</option>
                    <option value="15">15x15 (225 Teile)</option>
                    <option value="20">20x20 (400 Teile)</option>
                </select>
            </div>

            <button id="startButton" disabled>Puzzle starten</button>
            <button id="shuffleButton" disabled>Neu mischen</button>
            <button id="showPreviewButton" disabled>Vorschau anzeigen/ausblenden</button>
        </div>

        <div class="game-info">
            <div id="puzzleInfo"></div>
            <div id="timer">Zeit: 00:00</div>
        </div>

        <div class="game-container">
            <div class="preview-container" id="previewContainer">
                <h3>Vorschau</h3>
                <canvas id="previewCanvas"></canvas>
            </div>

            <div class="play-areas">
                <div class="piece-pool-wrapper">
                    <h3>Puzzleteile</h3>
                    <div class="piece-pool" id="piecePool">
                        <div class="drop-message">Die Puzzleteile erscheinen hier</div>
                    </div>
                </div>

                <div class="assembly-area-wrapper">
                    <h3>Zusammensetzen</h3>
                    <div class="assembly-area" id="assemblyArea">
                        <div class="drop-message">Setzen Sie hier das Puzzle zusammen</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="victory-overlay" id="victoryOverlay">
            <div class="victory-message">
                <h2>🎉 Glückwunsch! 🎉</h2>
                <p>Sie haben das Puzzle gelöst!</p>
                <p id="victoryTime"></p>
                <button id="newGameButton">Neues Spiel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
